name: Sync missing/stale Transfermarkt values

# DEAD END — kept for reference only, not scheduled. This ran fine locally
# (real search results, real values) but 0/357 lookups succeeded when run from
# a GitHub Actions runner — Transfermarkt blocks GitHub's shared-runner IPs at
# the network level, same underlying problem as sync-transfermarkt.yml (see
# its comment for the full story). Superseded by scripts/run_transfermarkt_gaps.sh
# + two LaunchAgents (com.gaffa.transfermarkt-gaps-daily,
# com.gaffa.transfermarkt-full-monthly) running this same script locally,
# where the IP isn't flagged.
#
# No `schedule:` trigger on purpose — it would just fail forever and spam
# failure emails. workflow_dispatch kept in case a self-hosted runner ever
# makes this viable again (not currently attached — this repo is public, and
# GitHub advises against self-hosted runners on public repos for exactly the
# reason that would otherwise fix this).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write values to Supabase (unchecked = dry run, prints proposed changes only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APPLY: ${{ github.event_name == 'schedule' && 'true' || (github.event.inputs.apply || 'false') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Resolve missing/stale market values
        run: |
          if [ "$APPLY" = "true" ]; then
            node --experimental-strip-types scripts/sync_transfermarkt_gaps.ts --all --apply
          else
            node --experimental-strip-types scripts/sync_transfermarkt_gaps.ts --all
          fi
