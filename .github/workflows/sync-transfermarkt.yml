name: Sync Transfermarkt market values

# DEAD END — kept for reference only, not scheduled. GitHub Actions' shared
# runners are blocked by Transfermarkt at the network level: this workflow's
# Docker-based squad crawl failed its very first run with a page-structure
# assertion error (tfmkt/crawlers/clubs.py's `assert len(with_teams_info) == 1`)
# because Transfermarkt serves a different response to GitHub's datacenter IPs
# than to a normal residential connection. Confirmed by sync_transfermarkt_gaps.ts
# separately: identical code, 0/357 successful lookups from a GitHub Actions
# runner, 100% success run locally moments later. Superseded by
# scripts/run_transfermarkt_gaps.sh + two LaunchAgents running on an actual
# machine — see that script's comments. Self-hosting a GitHub Actions runner
# would dodge the IP block too, but this repo is public, and GitHub advises
# against attaching self-hosted runners to public repos (any PR could execute
# arbitrary code on the runner machine).
#
# No `schedule:` trigger on purpose — it would just fail forever and spam
# failure emails. workflow_dispatch kept in case a self-hosted runner ever
# makes this viable again.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (scrape + transform only, skip the Supabase write)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Resolve current season start year
        id: season
        run: echo "year=$(node scripts/tm_season_year.mjs)" >> "$GITHUB_OUTPUT"

      - name: Scrape Premier League squads from Transfermarkt
        run: |
          set -euo pipefail
          echo '{"type":"competition","competition_type":"first_tier","href":"/premier-league/startseite/wettbewerb/GB1"}' \
            | docker run --rm -i dcaribou/transfermarkt-scraper:main python -m tfmkt clubs --season "${{ steps.season.outputs.year }}" \
            | docker run --rm -i dcaribou/transfermarkt-scraper:main python -m tfmkt players --season "${{ steps.season.outputs.year }}" \
            > raw_tm_players.jsonl
          wc -l raw_tm_players.jsonl

      - name: Transform scraper output into scripts/players.json
        run: node scripts/tm_transform.mjs < raw_tm_players.jsonl

      - name: Sync market values into Supabase
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npx tsx scripts/sync_transfermarkt.ts --dry-run
          else
            npx tsx scripts/sync_transfermarkt.ts
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfermarkt-sync-${{ github.run_id }}
          path: |
            raw_tm_players.jsonl
            scripts/players.json
          retention-days: 14
